play.http.secret.key = "change_me_in_production_32chars_min"
play.http.secret.key = ${?APPLICATION_SECRET}

play.filters.disabled += "play.filters.csrf.CSRFFilter"
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors {
  allowedOrigins = null
  allowedHttpMethods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization"]
}

play.evolutions.db.default.autoApply = true
play.evolutions.db.default.autoApplyDowns = false

# Database connection for Play Evolutions
db.default.driver   = "org.postgresql.Driver"
db.default.url      = "jdbc:postgresql://localhost:5432/chatdb"
db.default.url      = ${?DB_URL}
db.default.username = "chat"
db.default.username = ${?DB_USER}
db.default.password = "chat_secret"
db.default.password = ${?DB_PASSWORD}

# Database (Slick via HikariCP)
slick.dbs.default {
  profile = "slick.jdbc.PostgresProfile$"
  db {
    driver   = "org.postgresql.Driver"
    url      = "jdbc:postgresql://localhost:5432/chatdb"
    url      = ${?DB_URL}
    user     = "chat"
    user     = ${?DB_USER}
    password = "chat_secret"
    password = ${?DB_PASSWORD}
    numThreads = 10
    maxConnections = 10
    minConnections = 2
  }
}

# Redis
redis {
  host = "localhost"
  host = ${?REDIS_HOST}
  port = 6379
  port = ${?REDIS_PORT}
}

# JWT
jwt {
  secret      = "change_me_jwt_secret"
  secret      = ${?JWT_SECRET}
  expiryHours = 72
  expiryHours = ${?JWT_EXPIRY_HOURS}
}

# Chat settings
chat {
  messageExpirationDays = 30
  messageExpirationDays = ${?MESSAGE_EXPIRATION_DAYS}
}

# File uploads
uploads {
  dir          = ${user.home}"/uploads-dev"
  dir          = ${?UPLOAD_DIR}
  maxFileMb    = 20
  maxFileMb    = ${?MAX_FILE_SIZE_MB}
  maxImageMb   = 3
  maxImageMb   = ${?MAX_IMAGE_SIZE_MB}
}

play.http.parser.maxMemoryBuffer = 21MB
play.http.parser.maxDiskBuffer   = 21MB
