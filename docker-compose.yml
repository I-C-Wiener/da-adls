services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chatdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [chat-net]

  redis:
    image: redis:7.2-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [chat-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/chatdb"
      DB_USER: chat
      DB_PASSWORD: ${POSTGRES_PASSWORD:-chat_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-72}
      MESSAGE_EXPIRATION_DAYS: ${MESSAGE_EXPIRATION_DAYS:-30}
      UPLOAD_DIR: /uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-3}
      APPLICATION_SECRET: ${APPLICATION_SECRET:-change_me_in_production_32chars_min}
    volumes:
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [chat-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks: [chat-net]

networks:
  chat-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  uploads_data:
